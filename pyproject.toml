[project]
name = "belief-revision-llm"
version = "0.1.0"
description = "Behavioral experiments for studying belief revision in language models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8",
    "nnsight>=0.6",
    "numpy>=1.26",
    "openai>=1.0",
    "pandas>=2.1",
    "python-dotenv>=1.0",
    "scipy>=1.11",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "supabase==2.32.0",
]

[project.scripts]
validate-models = "belief_revision.cli.validate_models:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "belief_revision"
